services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    env_file:
      - /run/base44/app.env
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 3000 --strictPort"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
